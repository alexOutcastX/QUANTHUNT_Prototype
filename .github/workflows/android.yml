name: Android APK + Capgo OTA

# PHONE UPDATES SHIP AS APKs. The Capgo subscription has ended, so there is no
# over-the-air path: installed phones stay on whatever bundle they last pulled,
# however many times you promote to production. To update a phone, run this
# workflow (Actions → Android APK + Capgo OTA → Run workflow), download the
# `taureye-android-debug` artifact and install it over the existing app — same
# signing key, so it upgrades in place and keeps your sign-in and data.
#
# The web app is unaffected and always current: the VM serves it fresh on every
# load, with no Capgo in the path.
#
#  • APK (apk job): manual dispatch, builds the installable artifact. This is
#    the delivery mechanism.
#  • OTA (ota job): runs on production pushes touching mobile/** but is OPT-IN —
#    it skips unless the repo variable CAPGO_ENABLED=true. Re-enable it by
#    setting that variable once a plan is active again.
on:
  push:
    branches: [production]
    paths: ['mobile/**']
  workflow_dispatch:
    inputs:
      api_base:
        description: 'API base URL baked into the bundle'
        required: false
        # Blank = the TAUREYE_API_BASE repo variable (set it to the https
        # domain once TLS is live — see docs/TLS-RUNBOOK.md), else the VM IP.
        default: ''
      capgo_upload:
        description: 'Also publish an OTA bundle to Capgo'
        type: boolean
        required: false
        default: false

jobs:
  # ── Build an installable debug APK (manual) ──────────────────────────────────
  apk:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_BASE: ${{ github.event.inputs.api_base || vars.TAUREYE_API_BASE || 'http://161.118.174.177' }}
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: taureye-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Best-effort, and deliberately after the artifact upload: if OTA is dead
      # the APK is the whole point of this job and must still be downloadable.
      - name: Publish OTA bundle to Capgo (optional)
        if: github.event.inputs.capgo_upload == 'true'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then echo "No CAPGO_TOKEN secret — skipping."; exit 0; fi
          VER="$(node -p "require('./app.json').expo.version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
          npx @capgo/cli@latest bundle upload -a "$CAPGO_TOKEN" -c production -b "$VER" --path dist \
            || echo "::warning::OTA publish failed — the APK artifact above is still good."

  # ── Auto-publish OTA on every production ship ────────────────────────────────
  ota:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: Export web bundle (API base baked in)
        run: npx expo export --platform web --output-dir dist
        env:
          EXPO_PUBLIC_API_BASE: ${{ vars.TAUREYE_API_BASE || 'http://161.118.174.177' }}
      # OTA is OPT-IN. The Capgo subscription has ended, so phone updates ship
      # as APKs: run this workflow manually and install the artifact. Attempting
      # a publish against a lapsed plan just burns CI time on a call that cannot
      # succeed, so the default is to skip.
      #
      # To turn OTA back on, set the repo variable CAPGO_ENABLED=true (Settings →
      # Secrets and variables → Actions → Variables) with a live plan and a valid
      # CAPGO_TOKEN. It stays best-effort even then: a failed publish warns
      # rather than failing the promotion, because the web deploy is a separate
      # workflow that has already gone live by this point.
      - name: Publish OTA bundle to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
          CAPGO_ENABLED: ${{ vars.CAPGO_ENABLED }}
        run: |
          if [ "$CAPGO_ENABLED" != "true" ]; then
            echo "OTA is off (set repo variable CAPGO_ENABLED=true to enable)."
            echo "::notice::OTA skipped — phones update by installing a new APK, not over the air."
            exit 0
          fi
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "No CAPGO_TOKEN secret set — skipping OTA publish."
            echo "Add the secret and register once (npx @capgo/cli app add com.taureye.terminal.app) to enable."
            exit 0
          fi
          VER="$(node -p "require('./app.json').expo.version.split('.').slice(0,2).join('.')").${{ github.run_number }}"
          echo "Publishing OTA bundle $VER to Capgo channel production…"
          if npx @capgo/cli@latest bundle upload -a "$CAPGO_TOKEN" -c production -b "$VER" --path dist; then
            echo "::notice::OTA bundle $VER published — installed phones will pick it up on next launch."
          else
            echo "::warning::OTA publish FAILED for $VER (expired plan, revoked token or Capgo outage). \
          The web deploy is unaffected. Installed phones stay on their current bundle until you ship a new APK. \
          Unset CAPGO_ENABLED to stop attempting this."
          fi
