name: Deploy to VM

# LIVE-BACKEND hosting model (mirrors TaurEye's push-to-deploy, adapted for a
# resident service). Only the `production` branch is live: a push to production
# rsyncs the app to /opt/quanthunt on the VM, installs any new deps, and restarts
# the gunicorn service that nginx proxies to.
#
# Flow: work on feature branches -> PR into `main` (CI runs) -> merge. To go
# live, promote `main` into `production` (fast-forward or PR), which triggers
# this deploy. `main` itself does NOT deploy.
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     the VM's host/IP
#   VM_USER     the deploy user (opc / ubuntu) — needs passwordless sudo (Oracle
#               default users have it) for systemctl restart/reload
#   VM_SSH_KEY  the PRIVATE deploy key whose public half is in the VM's
#               ~/.ssh/authorized_keys

on:
  push:
    branches: [production]   # every promotion to production deploys (deterministic go-live)
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy (tag/sha/branch), e.g. v1.0.0 to roll back. Blank = latest."
        required: false
        default: ""

concurrency:
  group: deploy-vm
  cancel-in-progress: true

jobs:
  # Pre-deploy gate: the exact bundle about to go live must pass the headless
  # smoke suite (fake_server fixture) before rsync touches the VM. This is the
  # staging step — production is only promoted after it goes green.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install JS deps
        working-directory: mobile
        run: npm ci
      - name: Install Chromium
        working-directory: mobile
        run: npx playwright-core install chromium
      - name: Headless smoke against the shipping bundle
        run: node e2e/smoke.js

  deploy:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
        with:
          # On a normal push this is the pushed commit; on manual dispatch you can
          # supply any tag/sha (e.g. a previous release) to redeploy = rollback.
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot current release (for instant rollback)
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          # Copy the live code (not venv/.env/cache) to /opt/quanthunt.prev so
          # deploy/rollback.sh can restore the previous version instantly.
          ssh -i ~/.ssh/id_deploy "$U@$H" '
            APP=/opt/quanthunt
            if [ -d "$APP" ]; then
              rsync -a --delete --exclude venv --exclude .env \
                --exclude fund_cache.json --exclude mb_screen.json --exclude mom_screen.json --exclude pattern_screen.json --exclude __pycache__ \
                "$APP"/ "$APP".prev/ 2>/dev/null || true
            fi'

      - name: Rsync app + restart service
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
          APP: /opt/quanthunt
        run: |
          ssh -i ~/.ssh/id_deploy "$U@$H" "mkdir -p $APP"
          # Ship the app, but never delete the server-side venv or local env file.
          rsync -az --delete \
            --exclude venv --exclude .git --exclude node_modules \
            --exclude '__pycache__' --exclude '.env' \
            --exclude 'fund_cache.json' --exclude 'index_cache.json' --exclude 'mb_screen.json' --exclude 'mom_screen.json' --exclude 'pattern_screen.json' \
            --exclude 'graph_cache.json' --exclude 'broker_token.json' --exclude 'quanthunt.db*' \
            -e "ssh -i ~/.ssh/id_deploy" ./ "$U@$H:$APP/"
          # Install any new deps, sync the systemd unit (so gunicorn tuning like
          # thread count is version-controlled and applied on deploy), then
          # restart gunicorn and reload nginx.
          ssh -i ~/.ssh/id_deploy "$U@$H" "\
            $APP/venv/bin/pip install -q -r $APP/requirements.txt gunicorn && \
            sed 's/__DEPLOY_USER__/$U/g' $APP/deploy/quanthunt.service | sudo tee /etc/systemd/system/quanthunt.service >/dev/null && \
            sudo systemctl daemon-reload && \
            sudo systemctl restart quanthunt && \
            (sudo restorecon -R $APP 2>/dev/null || true) && \
            sudo systemctl reload nginx"

      - name: Verify the app is up (post-deploy smoke test)
        env:
          U: ${{ secrets.VM_USER }}
          H: ${{ secrets.VM_HOST }}
        run: |
          # Give gunicorn a moment to rebind, then confirm nginx -> app answers.
          # NOTE: every curl below uses --compressed, so it asks for gzip/br and
          # *fails* if the body will not decode. Plain `curl -fsS` sends no
          # Accept-Encoding and therefore only ever exercised the uncompressed
          # path — it would happily pass while real browsers got an undecodable
          # 200 and rendered a blank page.
          ssh -i ~/.ssh/id_deploy "$U@$H" '
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1/ping >/dev/null; then
                echo "OK: /ping responded on attempt $i"
                shell=$(curl -fsS --compressed http://127.0.0.1/) || {
                  echo "FAIL: / did not decode (corrupt precompressed variant?)"; exit 1; }
                case "$shell" in
                  *id=\"root\"*) echo "OK: RN-web shell served at /" ;;
                  *) echo "FAIL: / did not serve the web shell (is mobile/dist present?)"; exit 1 ;;
                esac
                # Every JS chunk the shell references must fetch AND decode.
                # These ship as immutable/max-age=1y, so a bad one poisons the
                # visitor browser cache for a year.
                # Check the DECODED byte count, not curl exit status: curl exits
                # 0 on a body it failed to unencode and just writes 0 bytes.
                chunks=$(printf "%s" "$shell" | grep -o "_expo/static/js/web/[^\"]*\.js" | sort -u)
                [ -n "$chunks" ] || { echo "FAIL: shell referenced no JS chunks"; exit 1; }
                for c in $chunks; do
                  sz=$(curl -fsS --compressed "http://127.0.0.1/$c" | wc -c)
                  if [ "${sz:-0}" -lt 100 ]; then
                    echo "FAIL: chunk empty or undecodable (${sz} bytes): $c"; exit 1
                  fi
                done
                echo "OK: $(printf "%s\n" "$chunks" | wc -l) JS chunks fetch and decode"
                exit 0
              fi
              sleep 2
            done
            echo "FAIL: app did not respond after restart"; exit 1'
