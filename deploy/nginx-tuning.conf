# Edge tuning that must survive certbot — installed to
# /etc/nginx/conf.d/zz-taureye-tuning.conf by the deploy workflow.
#
# WHY THIS IS A SEPARATE FILE.
#
# quanthunt.conf is not ours alone once TLS is on: `certbot --nginx` rewrites
# it in place to add the 443 server block, the certificate paths and the
# 80→443 redirect. A deploy that copied the repo's version over it would
# therefore delete the site's HTTPS config. So the deploy never touches that
# file, and anything it must be able to change lives here instead.
#
# Everything below is http-context, which is also strictly better than the
# per-server copy in quanthunt.conf: it applies to EVERY server block,
# including the 443 one certbot generates — which would otherwise have gone
# without these settings entirely.

# Several endpoints take a symbol list in the query string (/ltp,
# /fundamentals/bulk, /returns). nginx's default 8k request-line limit rejects
# a long one with 414 before Flask sees it, which the app can only observe as
# an unexplained failure — the screener read it as "0 of 1447 with financials".
# The clients batch these now; this is the backstop so a long URL degrades into
# a slow request, never a silent 414.
large_client_header_buffers 4 32k;
